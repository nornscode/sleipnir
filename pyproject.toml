[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleipnir"
version = "0.1.0"
description = "Coding harness worker for Norns"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # 0.7.0 honours max_tokens from the task envelope; below it the
    # ceiling is hard-coded at 4096 and a long turn comes back cut off.
    "norns-sdk>=0.7.0",
    "textual>=8.0",
]

[project.scripts]
sleip = "sleipnir.cli:main"
sleipnir = "sleipnir.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["sleipnir"]
