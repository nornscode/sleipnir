[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleipnir"
version = "0.1.0"
description = "Coding harness worker for Norns"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "norns-sdk>=0.5.0",
]

[project.scripts]
sleipnir = "sleipnir.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sleipnir"]
